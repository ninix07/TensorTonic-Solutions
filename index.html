<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Study Plan — 60 Days</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=JetBrains+Mono:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --ink: #0e0e0e;
            --paper: #f5f2eb;
            --paper2: #ede9df;
            --paper3: #e5e0d4;
            --rule: #c8c2b4;
            --rule2: #9a9080;
            --accent: #c84b2f;
            --accent2: #2f6bc8;
            --gold: #b8922a;
            --green: #2a7a4a;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Plus Jakarta Sans', sans-serif;
            --serif: 'Playfair Display', serif;
        }

        html {
            scroll-behavior: smooth
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--sans);
            font-weight: 300;
            line-height: 1.6;
            min-height: 100vh
        }

        /* ── TICKER BAR ── */
        .ticker {
            border-bottom: 1px solid var(--rule);
            background: var(--paper2);
            display: flex;
            align-items: center;
            gap: 0;
            overflow: hidden;
        }

        .ticker-label {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: .12em;
            color: var(--paper);
            background: var(--ink);
            padding: 12px 20px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .ticker-items {
            display: flex;
            gap: 0;
            overflow-x: auto;
            scrollbar-width: none;
            flex: 1;
        }

        .ticker-items::-webkit-scrollbar {
            display: none
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-right: 1px solid var(--rule);
            white-space: nowrap;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--rule2);
            flex-shrink: 0;
        }

        .ticker-item strong {
            color: var(--ink);
            font-weight: 500
        }

        .ticker-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0
        }

        /* ── STATS BAR ── */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-bottom: 1px solid var(--rule);
            background: var(--paper);
        }

        .stat-block {
            padding: 18px 28px;
            border-right: 1px solid var(--rule);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-block:last-child { border-right: none; }

        .stat-num {
            font-family: var(--serif);
            font-size: 30px;
            font-weight: 700;
            line-height: 1;
            color: var(--ink);
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .stat-num-sub {
            font-family: var(--mono);
            font-size: 13px;
            color: var(--rule2);
            font-weight: 400;
        }

        .stat-lbl {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--rule2);
        }

        /* ── PROGRESS RAIL ── */
        .progress-rail {
            padding: 0 56px;
            border-bottom: 1px solid var(--rule);
            background: var(--paper);
            display: flex;
            align-items: center;
            gap: 20px;
            height: 52px;
        }

        .progress-tag {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--rule2);
            white-space: nowrap;
            width: 88px;
        }

        .rail-track {
            flex: 1;
            height: 2px;
            background: var(--rule);
            position: relative;
        }

        .rail-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--accent);
            transition: width .5s ease;
            width: 0%;
        }

        .rail-pct {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--accent);
            width: 48px;
            text-align: right;
        }

        /* ── STAGE TIMELINE ── */
        .timeline-strip {
            display: flex;
            border-bottom: 1px solid var(--rule);
            overflow: hidden;
        }

        .tl-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 22px 0;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .1em;
            color: rgba(255, 255, 255, .65);
            font-weight: 500;
            cursor: default;
            transition: opacity .2s;
            border-right: 1px solid rgba(255, 255, 255, .08);
        }

        .tl-block-name {
            font-family: var(--serif);
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, .85);
            letter-spacing: 0;
        }

        .tl-block:last-child {
            border-right: none
        }

        .tl-block:hover {
            opacity: .8
        }

        .tl-s1 {
            background: #1a1a2e;
            flex: 8
        }

        .tl-s2 {
            background: #1a2e1a;
            flex: 12
        }

        .tl-s3 {
            background: #1a1e2e;
            flex: 14
        }

        .tl-s4 {
            background: #2e1a10;
            flex: 14
        }

        .tl-s5 {
            background: #2e1a1a;
            flex: 12
        }

        /* ── TIMELINE COMPLETION BAR ── */
        /* a header row (never clips) + a bar below. Fill = % problems done; the
           upright line = where TODAY falls. Gap + --pace colour = ahead/behind. */
        .tl-progress {
            padding: 14px 56px 16px;
            background: linear-gradient(180deg, var(--paper2), var(--paper));
            border-bottom: 1px solid var(--rule);
            --pace: #9a9080;
        }

        .tlp-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 10px;
        }

        .tlp-head-l {
            display: flex;
            align-items: baseline;
            gap: 7px;
        }

        .tlp-pct {
            font-family: var(--serif);
            font-size: 22px;
            font-weight: 700;
            line-height: 1;
            color: var(--ink);
        }

        .tlp-pct-sub {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--rule2);
        }

        .tlp-verdict {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--pace);
        }

        .tlp-when {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--rule2);
            white-space: nowrap;
        }

        .tlp-foot {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--rule2);
        }

        .tlp-foot strong {
            color: var(--ink);
            font-weight: 500;
        }

        .tlp-target {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--rule2);
            white-space: nowrap;
        }

        .tlp-target strong {
            color: var(--ink);
            font-weight: 500;
        }

        /* the bar (acts as the track) */
        .tlp-bar {
            position: relative;
            height: 12px;
            background: var(--paper3);
            border-radius: 6px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, .12);
        }

        /* completion fill — pace colour, glow + top sheen */
        .tlp-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 0%;
            background: var(--pace);
            border-radius: 6px;
            box-shadow: 0 0 10px -2px var(--pace);
            z-index: 2;
            transition: width .6s cubic-bezier(.4, 0, .2, 1), background .45s ease;
        }

        .tlp-fill::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(180deg, rgba(255, 255, 255, .40), rgba(255, 255, 255, 0) 55%);
        }

        /* weekend marks — faint vertical bands inside the bar, behind the fill */
        .tlp-weekends {
            position: absolute;
            inset: 0;
            border-radius: 6px;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .tlp-we {
            position: absolute;
            top: 0;
            bottom: 0;
            background: rgba(200, 75, 47, .16);
        }

        /* TODAY line — upright marker through the bar with a dot + caret on top */
        .tlp-today {
            position: absolute;
            top: -4px;
            bottom: -4px;
            left: 0%;
            width: 2px;
            background: var(--ink);
            transform: translateX(-1px);
            z-index: 3;
            transition: left .6s cubic-bezier(.4, 0, .2, 1);
        }

        .tlp-today::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ink);
            transform: translateX(-50%);
        }

        /* ── MAIN LAYOUT ── */
        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 56px 80px
        }

        /* ── STAGE ── */
        .stage {
            margin-top: 60px
        }

        .stage-rule {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 18px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--rule);
        }

        .stage-id {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--rule2);
        }

        .stage-name {
            font-family: var(--serif);
            font-size: 26px;
            letter-spacing: -.01em;
            font-weight: 700;
        }

        .stage-span {
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: .1em;
            color: var(--paper);
            padding: 5px 14px;
            border-radius: 1px;
        }

        .stage-span.s1 {
            background: #1a1a2e
        }

        .stage-span.s2 {
            background: #1a2e1a
        }

        .stage-span.s3 {
            background: #1a1e2e
        }

        .stage-span.s4 {
            background: #2e1a10
        }

        .stage-span.s5 {
            background: #2e1a1a
        }

        /* ── TOPIC CARD ── */
        .topic {
            border: 1px solid var(--rule);
            margin-bottom: 12px;
            background: var(--paper);
            transition: border-color .2s;
        }

        .topic:hover {
            border-color: var(--rule2)
        }

        .topic.complete {
            border-color: var(--green);
            background: rgba(42, 122, 74, .03)
        }

        .topic.complete .topic-name {
            text-decoration: line-through;
            text-decoration-color: rgba(42, 122, 74, .4);
            color: var(--rule2)
        }

        .topic-head {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: start;
            gap: 20px;
            padding: 22px 24px 16px;
            cursor: pointer;
            user-select: none;
        }

        .topic-head:hover .expand-icon {
            color: var(--ink)
        }

        .topic-meta {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 6px;
            flex-wrap: wrap
        }

        .topic-name {
            font-family: var(--serif);
            font-size: 20px;
            letter-spacing: -.01em;
            font-weight: 700;
        }

        .topic-days {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--rule2);
            letter-spacing: .08em;
        }

        .topic-desc {
            font-size: 13.5px;
            color: var(--rule2);
            line-height: 1.65;
            margin-bottom: 12px
        }

        .topic-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px
        }

        .tag {
            font-family: var(--mono);
            font-size: 10px;
            padding: 3px 9px;
            letter-spacing: .04em;
            border: 1px solid;
        }

        .tag-prereq {
            color: #5a3ec8;
            border-color: rgba(90, 62, 200, .25);
            background: rgba(90, 62, 200, .06)
        }

        .tag-concept {
            color: #2a6a8a;
            border-color: rgba(42, 106, 138, .25);
            background: rgba(42, 106, 138, .06)
        }

        .tag-applied {
            color: #8a4a2a;
            border-color: rgba(138, 74, 42, .25);
            background: rgba(138, 74, 42, .06)
        }

        .topic-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .day-count {
            font-family: var(--serif);
            font-size: 34px;
            line-height: 1;
            color: var(--ink);
            font-weight: 700;
        }

        .day-count-sub {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: .1em;
            color: var(--rule2);
            text-align: right;
        }

        .expand-icon {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--rule2);
            transition: transform .2s, color .2s;
            margin-top: 4px;
        }

        .topic.open .expand-icon {
            transform: rotate(180deg)
        }

        /* ── TOPIC PROGRESS MINI ── */
        .topic-progress {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 24px 12px;
        }

        .tp-bar {
            flex: 1;
            height: 1px;
            background: var(--rule);
            position: relative
        }

        .tp-fill {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--green);
            transition: width .3s
        }

        .tp-label {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--rule2);
            white-space: nowrap
        }

        /* ── PROBLEMS TABLE ── */
        .problems {
            display: none;
            border-top: 1px solid var(--rule)
        }

        .topic.open .problems {
            display: block
        }

        .prob-head {
            display: grid;
            grid-template-columns: 40px 1fr 96px 76px 76px;
            padding: 9px 24px;
            background: var(--paper2);
            border-bottom: 1px solid var(--rule);
            gap: 12px;
        }

        .ph-cell {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--rule2);
        }

        .ph-cell.right {
            text-align: center
        }

        .prob-row {
            display: grid;
            grid-template-columns: 40px 1fr 96px 76px 76px;
            padding: 11px 24px;
            gap: 12px;
            border-bottom: 1px solid var(--paper3);
            align-items: center;
            transition: background .15s;
        }

        .prob-row:last-child {
            border-bottom: none
        }

        .prob-row:hover {
            background: var(--paper2)
        }

        .prob-row.both-done {
            background: rgba(42, 122, 74, .04)
        }

        .prob-row.both-done .prob-name {
            color: var(--rule2);
            text-decoration: line-through;
            text-decoration-color: rgba(42, 122, 74, .35)
        }

        .prob-num {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--rule2);
        }

        .prob-name {
            font-size: 13.5px;
            font-weight: 400;
            line-height: 1.35;
        }

        .diff {
            font-family: var(--mono);
            font-size: 10px;
            padding: 3px 9px;
            text-align: center;
            border: 1px solid;
            width: fit-content;
            letter-spacing: .04em;
        }

        .diff.easy {
            color: var(--green);
            border-color: rgba(42, 122, 74, .3);
            background: rgba(42, 122, 74, .06)
        }

        .diff.medium {
            color: var(--gold);
            border-color: rgba(184, 146, 42, .3);
            background: rgba(184, 146, 42, .06)
        }

        .diff.hard {
            color: var(--accent);
            border-color: rgba(200, 75, 47, .3);
            background: rgba(200, 75, 47, .06)
        }

        /* ── DUAL CHECKBOXES ── */
        .check-pair {
            display: flex;
            gap: 4px;
            justify-content: center
        }

        .chk-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
        }

        .chk-box {
            width: 22px;
            height: 22px;
            border: 1.5px solid var(--rule);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
            background: var(--paper);
            flex-shrink: 0;
        }

        .chk-box:hover {
            border-color: var(--rule2)
        }

        .chk-box.on-theory {
            background: #1a1a2e;
            border-color: #1a1a2e
        }

        .chk-box.on-solve {
            background: var(--green);
            border-color: var(--green)
        }

        .chk-box svg {
            display: none
        }

        .chk-box.on-theory svg,
        .chk-box.on-solve svg {
            display: block
        }

        .chk-lbl {
            font-family: var(--mono);
            font-size: 8px;
            letter-spacing: .04em;
            color: var(--rule2);
            text-transform: uppercase;
        }

        /* ── CONNECTOR ── */
        .stage-connector {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 16px 0 0;
            padding-left: 0;
        }

        .conn-line {
            width: 1px;
            height: 32px;
            background: linear-gradient(to bottom, var(--rule), var(--accent));
            margin-left: 16px;
        }

        .conn-label {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--accent);
            letter-spacing: .1em;
        }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding: 32px 56px;
            border-top: 2px solid var(--ink);
            font-family: var(--mono);
            font-size: 11px;
            color: var(--rule2);
            letter-spacing: .08em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media(max-width:680px) {

            .tl-progress,
            .progress-rail,
            main,
            footer {
                padding-left: 20px;
                padding-right: 20px
            }

            .prob-head,
            .prob-row {
                grid-template-columns: 32px 1fr 74px 60px 60px;
                gap: 8px;
                padding: 9px 14px
            }

            .topic-head {
                padding: 16px 16px 12px
            }
        }
    </style>
</head>

<body>

    <!-- Stage timeline -->
    <div class="timeline-strip">
        <div class="tl-block tl-s1">S1 · DAYS 1–8</div>
        <div class="tl-block tl-s2">S2 · DAYS 9–20</div>
        <div class="tl-block tl-s3">S3 · DAYS 21–34</div>
        <div class="tl-block tl-s4">S4 · DAYS 35–48</div>
        <div class="tl-block tl-s5">S5 · DAYS 49–60</div>
    </div>

    <!-- Completion bar: fill = % problems done, upright line = where today falls -->
    <div class="tl-progress">
        <div class="tlp-head">
            <span class="tlp-head-l">
                <span class="tlp-pct" id="tlp-pct">0%</span>
                <span class="tlp-pct-sub">complete</span>
                <span class="tlp-verdict" id="tlp-verdict">· not started</span>
            </span>
            <span class="tlp-target" id="tlp-target"></span>
            <span class="tlp-when" id="tlp-when">Day 1 of 60 · begins Saturday</span>
        </div>
        <div class="tlp-bar">
            <div class="tlp-weekends" id="tlp-weekends" title="Weekend cram-days (Sat/Sun)"></div>
            <div class="tlp-fill" id="tlp-fill"></div>
            <div class="tlp-today" id="tlp-today"></div>
        </div>
        <div class="tlp-foot" id="tlp-foot" style="display:none">
            <span id="tlp-daily"></span>
            <span id="tlp-proj"></span>
        </div>
    </div>

    <!-- Stats bar -->
    <div class="stats-bar">
        <div class="stat-block">
            <div class="stat-num"><span id="s-done">0</span><span class="stat-num-sub">&thinsp;/ <span id="s-total">0</span></span></div>
            <div class="stat-lbl">Problems Complete</div>
        </div>
        <div class="stat-block">
            <div class="stat-num"><span id="s-topics">0</span><span class="stat-num-sub">&thinsp;/ 18</span></div>
            <div class="stat-lbl">Topics Done</div>
        </div>
        <div class="stat-block">
            <div class="stat-num"><span id="s-theory">0</span></div>
            <div class="stat-lbl">Theory Done</div>
        </div>
        <div class="stat-block">
            <div class="stat-num"><span id="s-solve">0</span></div>
            <div class="stat-lbl">Solved</div>
        </div>
    </div>

    <div class="progress-rail">
        <span class="progress-tag">Overall</span>
        <div class="rail-track">
            <div class="rail-fill" id="rail-fill"></div>
        </div>
        <span class="rail-pct" id="rail-pct">0%</span>
    </div>

    <main id="main"></main>


    <footer>
        <span>Progress saved · started <span id="f-start">—</span></span>
        <span id="f-brand">TensorTonic · 60-Day ML Plan</span>
        <span id="f-days">60 days remaining</span>
    </footer>

    <script>
        const K = 'tt-plan-v2';

        // Is plan-day d (1-based) a weekend, given day 1 = START_DOW?
        function isWeekend(d) { const dow = (START_DOW + (d - 1)) % 7; return dow === 5 || dow === 6; }

        // Smoothly allocate days (floor + effort^P spread), then roll up to
        // sequential day ranges, stage spans, day-counts and total.
        function computeSchedule() {
            const topics = [];
            PLAN.forEach(s => s.topics.forEach(t => topics.push(t)));
            const eff = topics.map(t =>
                t.probs.reduce((a, p) => a + (DIFF_WEIGHT[p.d] || 1), 0) * (CONCEPT_FACTOR[t.id] || 1));

            // floor: ≥ MIN_DAYS and ≤ MAX_PER_DAY problems on any day
            const days = topics.map(t => Math.max(MIN_DAYS, Math.ceil(t.probs.length / MAX_PER_DAY)));
            let extra = TARGET_DAYS - days.reduce((a, b) => a + b, 0);

            if (extra > 0) {
                // spare days to heavier topics ∝ effort^SPREAD_P
                const sc = eff.map(e => Math.pow(e, SPREAD_P));
                const tot = sc.reduce((a, b) => a + b, 0);
                const raw = sc.map(s => s / tot * extra);
                raw.forEach((r, i) => days[i] += Math.floor(r));
                let rem = extra - raw.reduce((a, r) => a + Math.floor(r), 0);
                const ord = raw.map((r, i) => ({ i, f: r - Math.floor(r) })).sort((a, b) => b.f - a.f);
                let k = 0;
                while (rem > 0 && ord.length) { days[ord[k % ord.length].i]++; rem--; k++; }
            } else if (extra < 0) {
                // floors overshot — trim lightest topics (never below MIN_DAYS)
                const ord = topics.map((t, i) => i).sort((a, b) => eff[a] - eff[b]);
                let rem = -extra, k = 0;
                while (rem > 0) { const i = ord[k % ord.length]; if (days[i] > MIN_DAYS) { days[i]--; rem--; } k++; }
            }

            // sequential day ranges + per-stage rollup
            let cursor = 1, ti = 0;
            STAGE_DAYS = []; STAGE_SPANS = [];
            PLAN.forEach(stage => {
                const start = cursor;
                stage.topics.forEach(t => {
                    const d = days[ti++];
                    TOPIC_SCHEDULE[t.id] = { dayStart: cursor, dayEnd: cursor + d - 1 };
                    cursor += d;
                });
                const end = cursor - 1;
                STAGE_DAYS.push(end - start + 1);
                STAGE_SPANS.push(`Days ${start}–${end}`);
            });
            PLAN_DAYS = cursor - 1;
        }

        </div>
        <div class="topic-progress" id="tp-${topic.id}">
          <div class="tp-bar"><div class="tp-fill" id="tf-${topic.id}" style="width:0%"></div></div>
          <span class="tp-label" id="tl-${topic.id}">0 / ${topic.probs.length}</span>
        </div>

          <div class="prob-head">
            <span class="ph-cell">#</span>
            <span class="ph-cell">Problem</span>

            <span class="ph-cell right">Solve</span>

          ${probsHtml}
        </div>`;
                    body.appendChild(card);

            updateGlobal();

        function toggleTopic(id) { document.getElementById('tc-' + id).classList.toggle('open'); }

        function toggle(pid, type) {
            const cur = getC(pid, type);
            setC(pid, type, !cur);
            const cls = type === 'theory' ? 'on-theory' : 'on-solve';
            const cb = document.getElementById(`cb-${type === 'theory' ? 'th' : 'so'}-${pid}`);
            if (cb) { if (!cur) { cb.classList.add(cls); cb.innerHTML = SVG_W } else { cb.classList.remove(cls); cb.innerHTML = ''; } }
            const th = getC(pid, 'theory'), so = getC(pid, 'solve');
            const row = document.getElementById('pr-' + pid);
            if (row) { if (th && so) row.classList.add('both-done'); else row.classList.remove('both-done'); }
            PLAN.forEach(stage => stage.topics.forEach(topic => {
                if (topic.probs.find(p => p.id === pid)) updateTopicProgress(topic);
            }));
            updateGlobal();
        }

        function paceColor(topicId, donePct) {
            if (!ST['__startDate']) return '#9a9080';
            const sched = TOPIC_SCHEDULE[topicId];
            if (!sched) return '#2a7a4a';
            const daysPassed = Math.floor((Date.now() - ST['__startDate']) / (1000 * 60 * 60 * 24));
            const currentDay = daysPassed + 1;
            let expectedPct = 0;
            if (currentDay >= sched.dayEnd) expectedPct = 100;
            else if (currentDay >= sched.dayStart) {
                expectedPct = Math.round((currentDay - sched.dayStart + 1) / (sched.dayEnd - sched.dayStart + 1) * 100);
            } else return '#2a7a4a'; // not started yet → green (no pressure)
            const lag = expectedPct - donePct;
            if (lag > 5) return '#c84b2f';
            if (lag > 0) return '#b8922a';
            return '#2a7a4a';
        }

        function getProgress() {
            let totalP = 0, doneP = 0;
            PLAN.forEach(s => s.topics.forEach(t => t.probs.forEach(p => {
                totalP++;
                const th = getC(p.id, 'theory'), so = getC(p.id, 'solve');
                doneP += (th ? 0.6 : 0) + (so ? 0.4 : 0);
            })));
            return { totalP, doneP, pct: totalP ? Math.round(doneP / totalP * 100) : 0 };
        }

        // likelihood of finishing on time = actual progress vs time elapsed
        function paceVerdict(expectedPct, actualPct) {
            if (actualPct >= 100) return { c: '#2a7a4a', t: 'COMPLETE' };
            const lag = expectedPct - actualPct;
            if (lag > 5) return { c: '#c84b2f', t: 'BEHIND' };
            if (lag > 0) return { c: '#b8922a', t: 'SLIPPING' };
            return { c: '#2a7a4a', t: 'ON TRACK' };
        }

        function updateTimelineProgress() {
            const bar = document.querySelector('.tl-progress');
            const fill = document.getElementById('tlp-fill');
            const today = document.getElementById('tlp-today');
            const pctEl = document.getElementById('tlp-pct');
            const verdict = document.getElementById('tlp-verdict');
            const when = document.getElementById('tlp-when');
            if (!bar || !fill || !today || !pctEl || !verdict || !when) return;

            const donePct = getProgress().pct;          // fill = actual completion
            fill.style.width = donePct + '%';
            pctEl.textContent = donePct + '%';

            const targetEl = document.getElementById('tlp-target');

            if (!ST['__startDate']) {                    // not started → no today line yet
                bar.style.setProperty('--pace', donePct > 0 ? '#2a7a4a' : '#9a9080');
                today.style.display = 'none';
                verdict.textContent = donePct > 0 ? '· under way' : '· not started';
                when.textContent = `Day 1 of ${PLAN_DAYS} · begins Saturday`;
                if (targetEl) targetEl.innerHTML = '';
                return;
            }

            const daysPassed = Math.floor((Date.now() - ST['__startDate']) / 86400000);
            const currentDay = Math.min(PLAN_DAYS, daysPassed + 1);
            const pctTime = Math.min(100, (daysPassed + 1) / PLAN_DAYS * 100); // used for today-line position
            let expectedDoneP2 = 0, totalP2 = 0;
            PLAN.forEach(s => s.topics.forEach(t => {
                const sched = TOPIC_SCHEDULE[t.id];
                totalP2 += t.probs.length;
                if (!sched) return;
                let frac = 0;
                if (currentDay > sched.dayEnd) frac = 1;
                else if (currentDay >= sched.dayStart)
                    frac = (currentDay - sched.dayStart + 1) / (sched.dayEnd - sched.dayStart + 1);
                expectedDoneP2 += t.probs.length * frac;
            }));
            const schedExpectedPct = totalP2 > 0 ? Math.round(expectedDoneP2 / totalP2 * 100) : 0;
            const v = paceVerdict(schedExpectedPct, donePct);   // pace = done vs schedule

            // find which topic currentDay falls in
            let nowTopic = null;
            PLAN.forEach(s => s.topics.forEach(t => {
                const sched = TOPIC_SCHEDULE[t.id];
                if (sched && currentDay >= sched.dayStart && currentDay <= sched.dayEnd) nowTopic = t;
            }));
            if (!nowTopic) {
                let minStart = Infinity;
                PLAN.forEach(s => s.topics.forEach(t => {
                    const sched = TOPIC_SCHEDULE[t.id];
                    if (sched && sched.dayStart > currentDay && sched.dayStart < minStart) { minStart = sched.dayStart; nowTopic = t; }
                }));
            }

            bar.style.setProperty('--pace', v.c);
            today.style.display = 'block';
            today.style.left = pctTime + '%';
            verdict.textContent = '· ' + v.t.toLowerCase();
            when.textContent = `Today · Day ${currentDay} of ${PLAN_DAYS}`;
            let nowLabel = '—';
            if (nowTopic) {
                const sorted = sortedProbs(nowTopic.probs);
                const nextProb = sorted.find(p => !(getC(p.id, 'theory') && getC(p.id, 'solve')));
                nowLabel = nextProb ? `${nowTopic.name} · ${nextProb.name}` : `${nowTopic.name} · all done`;
            }
            if (targetEl) targetEl.innerHTML = `target <strong>${schedExpectedPct}%</strong> · now <strong>${nowLabel}</strong>`;
        }

        function updateTopicProgress(topic) {
            let weighted = 0, actualDone = 0;
            topic.probs.forEach(p => {
                const th = getC(p.id, 'theory'), so = getC(p.id, 'solve');
                weighted += (th ? 0.6 : 0) + (so ? 0.4 : 0);
                if (th && so) actualDone++;
            });
            const total = topic.probs.length;
            const pct = total > 0 ? Math.round(weighted / total * 100) : 0;
            const fill = document.getElementById('tf-' + topic.id);
            const lbl = document.getElementById('tl-' + topic.id);
            if (fill) { fill.style.width = pct + '%'; fill.style.background = paceColor(topic.id, pct); }
            if (lbl) lbl.textContent = actualDone + ' / ' + total;
            const card = document.getElementById('tc-' + topic.id);
            if (card) { if (actualDone === total && total > 0) card.classList.add('complete'); else card.classList.remove('complete'); }
        }

        function updateGlobal() {
            let totalP = 0, doneP = 0, actualDoneP = 0, doneT = 0, theoryCount = 0, solveCount = 0;
            PLAN.forEach(stage => stage.topics.forEach(topic => {
                let td = 0;
                topic.probs.forEach(p => {
                    totalP++;
                    const th = getC(p.id, 'theory'), so = getC(p.id, 'solve');
                    doneP += (th ? 0.6 : 0) + (so ? 0.4 : 0);
                    if (th) theoryCount++;
                    if (so) solveCount++;
                    if (th && so) { actualDoneP++; td++; }
                });
                if (td === topic.probs.length && topic.probs.length > 0) doneT++;
            }));
            const pct = totalP > 0 ? Math.round(doneP / totalP * 100) : 0;
            const setEl = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
            setEl('s-done', actualDoneP); setEl('s-total', totalP);
            setEl('s-topics', doneT); setEl('s-theory', theoryCount); setEl('s-solve', solveCount);
            document.getElementById('rail-fill').style.width = pct + '%';

            // global pace colour — schedule-aware expected progress
            let gColor = '#9a9080'; // neutral — not started yet
            const foot = document.getElementById('tlp-foot');
            if (ST['__startDate']) {
                const daysPassed = Math.floor((Date.now() - ST['__startDate']) / (1000 * 60 * 60 * 24));
                const currentDay = daysPassed + 1;
                let expectedDoneP = 0;
                PLAN.forEach(s => s.topics.forEach(t => {
                    const sched = TOPIC_SCHEDULE[t.id];
                    if (!sched) return;
                    let frac = 0;
                    if (currentDay > sched.dayEnd) frac = 1;
                    else if (currentDay >= sched.dayStart)
                        frac = (currentDay - sched.dayStart + 1) / (sched.dayEnd - sched.dayStart + 1);
                    expectedDoneP += t.probs.length * frac;
                }));
                const expectedPct = totalP > 0 ? Math.round(expectedDoneP / totalP * 100) : 0;
                const lag = expectedPct - pct;
                if (lag > 5) gColor = '#c84b2f';
                else if (lag > 0) gColor = '#b8922a';
                else gColor = '#2a7a4a';

                // daily target
                const gap = expectedDoneP - doneP;
                const dailyEl = document.getElementById('tlp-daily');
                if (dailyEl) {
                    if (gap <= 0) dailyEl.innerHTML = `today · <strong style="color:#2a7a4a">on track</strong>`;
                    else dailyEl.innerHTML = `today · do <strong>~${Math.ceil(gap)}</strong> more problem${Math.ceil(gap) > 1 ? 's' : ''}`;
                }

                // finish projection
                const rate = daysPassed > 0 ? doneP / daysPassed : 0;
                const projEl = document.getElementById('tlp-proj');
                if (projEl) {
                    if (rate <= 0) {
                        projEl.innerHTML = `finish · <strong>—</strong>`;
                    } else {
                        const remaining = totalP - doneP;
                        const daysLeft = Math.ceil(remaining / rate);
                        const finishMs = ST['__startDate'] + (daysPassed + daysLeft) * 86400000;
                        const deadlineMs = ST['__startDate'] + PLAN_DAYS * 86400000;
                        const diffDays = Math.round((finishMs - deadlineMs) / 86400000);
                        const dateStr = new Date(finishMs).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                        const diffStr = diffDays > 0 ? `<strong style="color:#c84b2f">${diffDays}d over</strong>`
                            : diffDays < 0 ? `<strong style="color:#2a7a4a">${Math.abs(diffDays)}d early</strong>`
                            : `<strong style="color:#2a7a4a">on time</strong>`;
                        projEl.innerHTML = `finish · <strong>${dateStr}</strong> · ${diffStr}`;
                    }
                }

                if (foot) foot.style.display = 'flex';
            } else {
                if (foot) foot.style.display = 'none';
            }

            const rf = document.getElementById('rail-fill');
            if (rf) rf.style.background = gColor;
            const rp = document.getElementById('rail-pct');
            if (rp) { rp.textContent = pct + '%'; rp.style.color = gColor; }

            if (ST['__startDate']) {
                const d = new Date(ST['__startDate']);
                document.getElementById('f-start').textContent = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                const rem = PLAN_DAYS - Math.floor((Date.now() - ST['__startDate']) / (1000 * 60 * 60 * 24));
                document.getElementById('f-days').textContent = Math.max(0, rem) + ' days remaining';
            }

            updateTimelineProgress();
        }

        render();
    </script>
</body>

</html>
